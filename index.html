<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVerse Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-1: #0f0c29; --bg-2: #302b63; --bg-3: #24243e;
      --pink: #e94560; --pink-dark: #c23152; --teal: #4ecca3;
      --tg: #0088cc;
      --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.12);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      color: #eee; min-height: 100vh; overflow-x: hidden; position: relative;
      display: flex; flex-direction: column;
    }
    body::before, body::after {
      content: ''; position: fixed;
      width: 60vmax; height: 60vmax; border-radius: 50%;
      filter: blur(80px); opacity: 0.25; z-index: 0; pointer-events: none;
    }
    body::before {
      background: radial-gradient(circle, var(--pink), transparent 60%);
      top: -20vmax; left: -20vmax;
      animation: floatA 18s ease-in-out infinite;
    }
    body::after {
      background: radial-gradient(circle, var(--teal), transparent 60%);
      bottom: -20vmax; right: -20vmax;
      animation: floatB 22s ease-in-out infinite;
    }
    @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(8vmax,6vmax); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-8vmax,-6vmax); } }

    .topbar {
      position: fixed; top: 20px; right: 20px; z-index: 50;
      display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; justify-content: flex-end;
    }
    .lang-switch { display: flex; gap: 8px; }
    .lang-btn, .top-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      background: var(--glass); color: #ddd;
      border: 1px solid var(--glass-border);
      border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    .lang-btn:hover, .lang-btn.active {
      background: var(--pink); color: #fff; border-color: var(--pink);
      box-shadow: 0 0 20px rgba(233,69,96,0.5);
    }
    .top-btn.support {
      background: linear-gradient(135deg, #ff5f6d, #ffc371);
      color: #1a1a1a; border: none;
      box-shadow: 0 4px 18px rgba(255,95,109,0.4);
    }
    .top-btn.support:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,95,109,0.6); }
    .top-btn.games {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; border: none;
      box-shadow: 0 4px 18px rgba(233,69,96,0.4);
    }
    .top-btn.games:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,69,96,0.6); }
    .top-btn svg { width: 16px; height: 16px; }

    .scene {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 120px 24px 60px;
      text-align: center;
    }

    .logo {
      width: 140px; height: 140px;
      border-radius: 32px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(233,69,96,0.4), 0 0 0 1px rgba(255,255,255,0.1);
      animation: float 4s ease-in-out infinite;
      background: #fff;
      margin-bottom: 28px;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, var(--pink) 60%, var(--teal) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 0 40px rgba(233,69,96,0.3);
    }
    .subtitle { font-size: 16px; color: #aaa; margin-bottom: 30px; max-width: 520px; }

    .telegram-link {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--tg), #005580);
      color: #fff; text-decoration: none;
      border-radius: 999px;
      font-size: 16px; font-weight: 700;
      transition: all 0.3s;
      box-shadow: 0 6px 24px rgba(0,136,204,0.35);
    }
    .telegram-link:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(0,136,204,0.55); }

    .footer { margin-top: 48px; color: #777; font-size: 13px; line-height: 1.9; }
    .footer a { color: #a0a0b8; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s; }
    .footer a:hover { color: #fff; border-bottom-color: #fff; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="lang-switch">
      <button class="lang-btn" onclick="setLang('ru', this)">RU</button>
      <button class="lang-btn" onclick="setLang('en', this)">EN</button>
    </div>
    <a href="https://www.donationalerts.com/r/nversegames" target="_blank" rel="noopener" class="top-btn support">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.4 2.3 4.5 6 4.5c2.2 0 3.7 1.3 4.5 2.6.8-1.3 2.3-2.6 4.5-2.6 3.7 0 5.6 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span data-ru="Поддержать" data-en="Support">Поддержать</span>
    </a>
    <a href="games.html" class="top-btn games">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2.2a2 2 0 0 0 1.6-.8l1.4-1.9a1 1 0 0 1 .8-.4h6a1 1 0 0 1 .8.4l1.4 1.9a2 2 0 0 0 1.6.8H21a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM8 13H6v2H4v-2H2v-2h2V9h2v2h2v2zm7.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span data-ru="Наши игры" data-en="Our Games">Наши игры</span>
    </a>
  </div>

  <section class="scene">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/nversegames/NVerse-Games/main/NVerseGamesLogo.jpg" alt="NVerse Games Logo">
    </div>

    <h1 data-ru="NVerse Games" data-en="NVerse Games">NVerse Games</h1>
    <p class="subtitle" data-ru="Независимая студия браузерных игр. Играй бесплатно прямо в браузере." data-en="Independent browser game studio. Play for free right in your browser.">Независимая студия браузерных игр. Играй бесплатно прямо в браузере.</p>

    <a href="https://t.me/NVerse_Games" target="_blank" rel="noopener" class="telegram-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.04 15.47l-.38 5.36c.54 0 .78-.23 1.06-.51l2.55-2.44 5.29 3.87c.97.53 1.66.25 1.92-.9L21.9 4.6c.32-1.43-.52-1.99-1.46-1.64L2.5 10.2c-1.4.54-1.38 1.32-.24 1.67l4.6 1.43L17.5 7.5c.5-.33.96-.15.58.18l-8.99 8.12z"/></svg>
      <span data-ru="Наши проекты в Telegram" data-en="Our projects on Telegram">Наши проекты в Telegram</span>
    </a>

    <div class="footer">
      <div>© 2026 NVerse Games. <span data-ru="Все права защищены." data-en="All rights reserved.">Все права защищены.</span></div>
      <div><span data-ru="Разработчик:" data-en="Developer:">Разработчик:</span> NVerse Games</div>
      <div>Email: <a href="mailto:bestynest22@gmail.com">bestynest22@gmail.com</a></div>
      <div style="margin-top:14px;">
        <a href="privacy-policy.html" data-ru="Политика конфиденциальности" data-en="Privacy Policy">Политика конфиденциальности</a>
        &nbsp;·&nbsp;
        <a href="terms.html" data-ru="Условия использования" data-en="Terms of Service">Условия использования</a>
      </div>
    </div>
  </section>

  <script>
    function setLang(lang, btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('lang', lang);
      applyLang(lang);
    }
    function applyLang(lang) {
      document.querySelectorAll('[data-ru]').forEach(el => {
        el.textContent = lang === 'ru' ? el.dataset.ru : el.dataset.en;
      });
    }
    var saved = localStorage.getItem('lang') || 'ru';
    var btns = document.querySelectorAll('.lang-btn');
    btns.forEach(b => b.classList.remove('active'));
    if (saved === 'ru') btns[0].classList.add('active');
    else btns[1].classList.add('active');
    applyLang(saved);
  </script>
</body>
</html>
